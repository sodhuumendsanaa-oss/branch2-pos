<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Салбар 2 - Касс</title>
  <link rel="manifest" href="manifest.json" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            surface: { 50: '#f8fafc', 100: '#111119', 200: '#16161f', 300: '#1c1c27', 400: '#242430', 500: '#2a2a38' },
            brand: { 400: '#34d399', 500: '#10b981', 600: '#059669' }
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0f; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 99px; }

    /* Animations */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
      50% { box-shadow: 0 0 32px 4px rgba(16, 185, 129, 0.3); }
    }
    @keyframes countUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .anim-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-glow { animation: glowPulse 2s ease-in-out; }
    .anim-count { animation: countUp 0.4s ease-out forwards; }
    .anim-fade { animation: fadeIn 0.3s ease-out forwards; }

    /* Glass effect */
    .glass { background: rgba(22, 22, 31, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #34d399, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Tab styles */
    .tab-active { color: #10b981; border-color: #10b981; }
    .tab-inactive { color: #64748b; border-color: transparent; }
    .tab-inactive:hover { color: #94a3b8; }

    /* Card hover */
    .order-card {
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .order-card:hover {
      border-color: rgba(255,255,255,0.08);
      background: rgba(28, 28, 39, 0.9);
    }

    /* Status indicator pulse */
    .status-pulse { position: relative; }
    .status-pulse::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid rgba(16, 185, 129, 0.4);
      animation: ripple 2s infinite;
    }

    /* Number counter */
    .mono-num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

    /* Bottom nav for mobile */
    .bottom-nav {
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }

    /* Date picker pill */
    .date-pill {
      transition: all 0.2s ease;
    }
    .date-pill.active {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }
  </style>
</head>

<body class="text-slate-100 min-h-screen flex flex-col">

  <!-- ===== HEADER ===== -->
  <header class="sticky top-0 z-50 glass border-b border-white/5">
    <div class="max-w-2xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <!-- Live Status Dot -->
          <div class="relative">
            <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 status-pulse"></div>
          </div>
          <div>
            <h1 class="text-sm font-bold text-white tracking-tight">Салбар 2</h1>
            <p id="connectionStatus" class="text-[10px] text-slate-500 font-medium">Холбогдож байна...</p>
          </div>
        </div>

        <!-- Right Actions -->
        <div class="flex items-center gap-1">
          <button onclick="toggleSound()" id="soundBtn" class="p-2 rounded-xl hover:bg-white/5 transition text-lg" title="Дуу">
            🔔
          </button>
          <button onclick="requestNotifPermission()" id="notifBtn" class="p-2 rounded-xl hover:bg-white/5 transition text-lg" title="Мэдэгдэл">
            📳
          </button>
          <button onclick="openConfigModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl hover:bg-white/10 bg-white/5 transition text-xs font-semibold text-slate-300 border border-white/5">
            ⚙️ Тохиргоо
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 pt-5 pb-24">

    <!-- Notification Permission Banner -->
    <div id="notifBanner" class="hidden mb-4 rounded-2xl bg-gradient-to-r from-indigo-500/10 to-purple-500/10 border border-indigo-500/20 p-4 anim-fade">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="text-2xl">🔔</span>
          <div>
            <div class="text-xs font-bold text-white">Push мэдэгдэл идэвхжүүлэх</div>
            <div class="text-[10px] text-slate-400 mt-0.5">Цонх багасгасан байсан ч шинэ шилжүүлэг ирэхэд мэдэгдэл харуулна</div>
          </div>
        </div>
        <button onclick="requestNotifPermission()" class="shrink-0 px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-[11px] font-bold text-white transition shadow-lg shadow-indigo-900/30">
          Зөвшөөрөх
        </button>
      </div>
    </div>

    <!-- Summary Hero Card -->
    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-surface-300 to-surface-200 border border-white/5 p-5 mb-5">
      <!-- Decorative gradient orb -->
      <div class="absolute -top-12 -right-12 w-40 h-40 rounded-full bg-emerald-500/10 blur-3xl pointer-events-none"></div>

      <div class="relative z-10">
        <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-widest mb-2" id="summaryDateLabel">Өнөөдөр</div>
        <div class="flex items-end gap-3 mb-4">
          <div id="summaryAmount" class="text-4xl sm:text-5xl font-black gradient-text mono-num">₮0</div>
        </div>

        <!-- Mini Stats Row -->
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-white/[0.03] rounded-xl px-3 py-2.5">
            <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Гүйлгээ</div>
            <div id="summaryCount" class="text-lg font-bold text-white mono-num mt-0.5">0</div>
          </div>
          <div class="bg-white/[0.03] rounded-xl px-3 py-2.5">
            <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Тулгасан</div>
            <div id="summaryConfirmed" class="text-lg font-bold text-emerald-400 mono-num mt-0.5">0</div>
          </div>
          <div class="bg-white/[0.03] rounded-xl px-3 py-2.5">
            <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Хүлээж буй</div>
            <div id="summaryPending" class="text-lg font-bold text-amber-400 mono-num mt-0.5">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Date Selector (Horizontal Scroll) -->
    <div class="mb-5">
      <div id="dateScroller" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar" style="scrollbar-width: none;">
        <!-- JS will fill date pills here -->
      </div>
    </div>

    <!-- Tab Bar -->
    <div class="flex gap-1 mb-4 border-b border-white/5">
      <button id="tabAll" onclick="switchTab('all')" class="px-4 py-2.5 text-xs font-semibold border-b-2 transition tab-active">
        Бүгд
      </button>
      <button id="tabPending" onclick="switchTab('pending')" class="px-4 py-2.5 text-xs font-semibold border-b-2 transition tab-inactive">
        Хүлээж буй
      </button>
      <button id="tabConfirmed" onclick="switchTab('confirmed')" class="px-4 py-2.5 text-xs font-semibold border-b-2 transition tab-inactive">
        Тулгасан ✓
      </button>
    </div>

    <!-- Orders Feed -->
    <div id="ordersList" class="space-y-2.5">
      <div id="emptyState" class="text-center py-20 anim-fade">
        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-surface-300 flex items-center justify-center text-3xl">📲</div>
        <h3 class="text-sm font-semibold text-slate-300 mb-1">Шилжүүлэг хүлээж байна</h3>
        <p class="text-xs text-slate-600 max-w-xs mx-auto leading-relaxed">
          Банкны орлого орж ирмэгц автоматаар дуу дуугарч, шууд энд гарч ирнэ.
        </p>
        <button onclick="playCashierChime()" class="mt-4 px-4 py-2 rounded-xl bg-surface-400 text-xs font-semibold text-slate-300 hover:bg-surface-500 transition">
          🔊 Хонх турших
        </button>
      </div>
    </div>

  </main>

  <!-- ===== CONFIGURATION MODAL ===== -->
  <div id="configModal" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-md hidden items-center justify-center p-4" style="display:none;">
    <div class="bg-surface-300 border border-white/10 rounded-2xl max-w-sm w-full p-5 shadow-2xl anim-slide-up">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-bold text-white">⚙️ Тохиргоо</h3>
        <button onclick="closeConfigModal()" class="text-slate-500 hover:text-white transition text-lg">✕</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Firebase Database URL</label>
          <input id="cfgDbUrl" type="text" placeholder="https://your-project-default-rtdb.firebasedatabase.app" class="w-full bg-surface-100 border border-white/5 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/20 transition" />
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Project ID</label>
          <input id="cfgProjectId" type="text" placeholder="my-branch-app" class="w-full bg-surface-100 border border-white/5 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/20 transition" />
        </div>
      </div>

      <div class="flex gap-2 mt-5">
        <button onclick="closeConfigModal()" class="flex-1 px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-400 bg-white/5 hover:bg-white/10 transition">Хаах</button>
        <button onclick="saveConfig()" class="flex-1 px-4 py-2.5 rounded-xl text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-500 transition shadow-lg shadow-emerald-900/30">Хадгалах</button>
      </div>
    </div>
  </div>

  <!-- ===== FULL SCREEN NEW PAYMENT OVERLAY ===== -->
  <div id="newPaymentOverlay" class="fixed inset-0 z-[55] bg-black/90 backdrop-blur-lg hidden items-center justify-center p-6" style="display:none;">
    <div class="text-center anim-slide-up">
      <div class="text-6xl mb-4">💰</div>
      <div class="text-sm font-semibold text-emerald-400 uppercase tracking-widest mb-2">Шинэ орлого!</div>
      <div id="overlayAmount" class="text-5xl sm:text-6xl font-black gradient-text mono-num mb-3">₮0</div>
      <div id="overlayRemark" class="text-base text-slate-300 font-medium mb-8">-</div>
      <button onclick="dismissOverlay()" class="px-8 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-sm font-bold text-white transition shadow-xl shadow-emerald-900/40">
        Ойлголоо ✓
      </button>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════
    //  CONFIGURATION
    // ═══════════════════════════════════════════
    const CONFIG = {
      databaseURL: localStorage.getItem('fb_db_url') || "https://branch2-pos-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: localStorage.getItem('fb_project_id') || "branch2-pos"
    };

    // ═══════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════
    let audioContext = null;
    let isSoundEnabled = true;
    let isFirstLoad = true;
    let allTransactions = {};   // all data keyed by Firebase ID
    let currentTab = 'all';
    let selectedDate = todayStr();

    function todayStr() {
      return new Date().toISOString().slice(0, 10); // "2026-09-10"
    }

    // ═══════════════════════════════════════════
    //  AUDIO: Cashier Chime (Web Audio API)
    // ═══════════════════════════════════════════
    function playCashierChime() {
      if (!isSoundEnabled) return;
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        const now = audioContext.currentTime;

        // Three-note ascending chime: C6 → E6 → G6
        const notes = [
          { freq: 1046.5, delay: 0,    dur: 0.5, vol: 0.3 },
          { freq: 1318.5, delay: 0.1,  dur: 0.5, vol: 0.35 },
          { freq: 1568.0, delay: 0.22, dur: 0.7, vol: 0.3 }
        ];

        notes.forEach(n => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(n.freq, now + n.delay);
          gain.gain.setValueAtTime(n.vol, now + n.delay);
          gain.gain.exponentialRampToValueAtTime(0.001, now + n.delay + n.dur);
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start(now + n.delay);
          osc.stop(now + n.delay + n.dur);
        });
      } catch (e) { console.warn("Audio error:", e); }
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      const btn = document.getElementById('soundBtn');
      btn.innerText = isSoundEnabled ? '🔔' : '🔕';
      if (isSoundEnabled) playCashierChime();
    }

    // ═══════════════════════════════════════════
    //  DATE HELPERS
    // ═══════════════════════════════════════════
    function getDateStr(date) { return date.toISOString().slice(0, 10); }

    function getTransactionDate(tx) {
      if (!tx.timestamp) return todayStr();
      return new Date(tx.timestamp).toISOString().slice(0, 10);
    }

    function formatDateLabel(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const today = todayStr();
      const yesterday = getDateStr(new Date(Date.now() - 86400000));
      if (dateStr === today) return 'Өнөөдөр';
      if (dateStr === yesterday) return 'Өчигдөр';
      const months = ['1-р сар','2-р сар','3-р сар','4-р сар','5-р сар','6-р сар','7-р сар','8-р сар','9-р сар','10-р сар','11-р сар','12-р сар'];
      return `${months[d.getMonth()]} ${d.getDate()}`;
    }

    function renderDatePills() {
      const container = document.getElementById('dateScroller');
      container.innerHTML = '';

      // Collect unique dates from transactions
      const dates = new Set();
      dates.add(todayStr()); // Always include today
      Object.values(allTransactions).forEach(tx => {
        dates.add(getTransactionDate(tx));
      });

      // Sort descending (newest first)
      const sorted = [...dates].sort((a, b) => b.localeCompare(a));

      sorted.forEach(dateStr => {
        const pill = document.createElement('button');
        pill.className = `date-pill shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold border transition ${dateStr === selectedDate ? 'active' : 'bg-surface-300 text-slate-400 border-white/5 hover:border-white/10'}`;
        pill.innerText = formatDateLabel(dateStr);
        pill.onclick = () => selectDate(dateStr);
        container.appendChild(pill);
      });
    }

    function selectDate(dateStr) {
      selectedDate = dateStr;
      renderDatePills();
      renderAllCards();
      updateSummary();
    }

    // ═══════════════════════════════════════════
    //  TAB SWITCHING
    // ═══════════════════════════════════════════
    function switchTab(tab) {
      currentTab = tab;
      ['All', 'Pending', 'Confirmed'].forEach(t => {
        const el = document.getElementById('tab' + t);
        el.className = el.className.replace(/tab-(active|inactive)/g, '') + (t.toLowerCase() === tab ? ' tab-active' : ' tab-inactive');
      });
      renderAllCards();
    }

    // ═══════════════════════════════════════════
    //  FIREBASE INIT
    // ═══════════════════════════════════════════
    function initFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp({ databaseURL: CONFIG.databaseURL, projectId: CONFIG.projectId });
        }

        const db = firebase.database();
        const connectionRef = db.ref(".info/connected");
        const ordersRef = db.ref("branch2_orders");

        // Connection status
        connectionRef.on("value", snap => {
          const connected = snap.val() === true;
          const el = document.getElementById('connectionStatus');
          const dot = document.getElementById('statusDot');

          if (connected) {
            el.innerText = "Шууд холбогдсон";
            el.className = "text-[10px] text-emerald-500 font-medium";
            dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 status-pulse";
          } else {
            el.innerText = "Холболт салсан...";
            el.className = "text-[10px] text-amber-500 font-medium";
            dot.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
          }
        });

        // Realtime listener
        ordersRef.limitToLast(200).on("child_added", snap => {
          const key = snap.key;
          const data = snap.val();

          if (!allTransactions[key]) {
            allTransactions[key] = data;

            if (!isFirstLoad) {
              playCashierChime();
              showNewPaymentOverlay(data);
              sendBrowserNotification(data);
            }

            renderDatePills();
            renderAllCards();
            updateSummary();
          }
        });

        ordersRef.on("child_changed", snap => {
          const key = snap.key;
          allTransactions[key] = snap.val();
          renderAllCards();
          updateSummary();
        });

        ordersRef.once("value", () => {
          isFirstLoad = false;
          renderDatePills();
          renderAllCards();
          updateSummary();
        });

      } catch (err) {
        console.error("Firebase error:", err);
        document.getElementById('connectionStatus').innerText = "Тохиргооны алдаа!";
      }
    }

    // ═══════════════════════════════════════════
    //  RENDER CARDS
    // ═══════════════════════════════════════════
    function renderAllCards() {
      const list = document.getElementById('ordersList');
      list.innerHTML = '';

      // Get transactions for selected date
      const entries = Object.entries(allTransactions)
        .filter(([k, tx]) => {
          const matchDate = getTransactionDate(tx) === selectedDate;
          const matchTab = currentTab === 'all' ||
            (currentTab === 'pending' && tx.status !== 'confirmed') ||
            (currentTab === 'confirmed' && tx.status === 'confirmed');
          return matchDate && matchTab;
        })
        .sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));

      if (entries.length === 0) {
        list.innerHTML = `
          <div class="text-center py-16 anim-fade">
            <div class="text-3xl mb-3 opacity-40">${currentTab === 'confirmed' ? '✅' : currentTab === 'pending' ? '⏳' : '📭'}</div>
            <p class="text-xs text-slate-600">${
              currentTab === 'confirmed' ? 'Тулгасан гүйлгээ алга' :
              currentTab === 'pending' ? 'Хүлээж буй гүйлгээ алга' :
              selectedDate === todayStr() ? 'Өнөөдрийн гүйлгээ одоогоор алга' : 'Энэ өдөрт гүйлгээ алга'
            }</p>
          </div>`;
        return;
      }

      entries.forEach(([key, data], idx) => {
        const card = document.createElement('div');
        card.id = `order-${key}`;
        card.style.animationDelay = `${idx * 0.03}s`;
        card.style.opacity = '0';

        const isConfirmed = data.status === 'confirmed';
        const amount = data.amount || '0';
        const remark = data.remark || '-';
        const time = data.timestamp ? new Date(data.timestamp).toLocaleTimeString('mn-MN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '-';

        card.className = `order-card rounded-2xl p-4 anim-slide-up ${isConfirmed ? 'bg-surface-200' : 'bg-surface-300'}`;

        card.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <!-- Icon -->
              <div class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center text-lg ${isConfirmed ? 'bg-emerald-500/10' : 'bg-emerald-500/15'}">
                ${isConfirmed ? '✅' : '💵'}
              </div>
              <!-- Info -->
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-base sm:text-lg font-extrabold ${isConfirmed ? 'text-slate-400' : 'text-emerald-400'} mono-num">₮${escapeHtml(amount)}</span>
                  ${!isConfirmed ? '<span class="shrink-0 w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>' : ''}
                </div>
                <div class="text-xs text-slate-500 truncate mt-0.5">${escapeHtml(remark)}</div>
              </div>
            </div>

            <!-- Right Side -->
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[10px] text-slate-600 font-medium hidden sm:block">${time}</span>
              <button onclick="toggleConfirm('${key}')" class="px-3 py-1.5 rounded-xl text-[11px] font-bold transition ${
                isConfirmed
                  ? 'bg-white/5 text-slate-500 hover:bg-white/10'
                  : 'bg-emerald-600 text-white hover:bg-emerald-500 shadow-lg shadow-emerald-900/20'
              }">
                ${isConfirmed ? 'Буцаах' : 'Тулгах'}
              </button>
            </div>
          </div>
          <div class="text-[10px] text-slate-600 mt-2 sm:hidden">${time}</div>
        `;

        list.appendChild(card);
      });
    }

    // ═══════════════════════════════════════════
    //  SUMMARY UPDATE
    // ═══════════════════════════════════════════
    function updateSummary() {
      const dayTx = Object.values(allTransactions).filter(tx => getTransactionDate(tx) === selectedDate);

      let total = 0;
      let confirmed = 0;
      let pending = 0;

      dayTx.forEach(tx => {
        const num = parseFloat((tx.amount || '0').replace(/,/g, ''));
        if (!isNaN(num)) total += num;
        if (tx.status === 'confirmed') confirmed++;
        else pending++;
      });

      document.getElementById('summaryCount').innerText = dayTx.length;
      document.getElementById('summaryAmount').innerText = '₮' + total.toLocaleString('en-US');
      document.getElementById('summaryConfirmed').innerText = confirmed;
      document.getElementById('summaryPending').innerText = pending;
      document.getElementById('summaryDateLabel').innerText = formatDateLabel(selectedDate);
    }

    // ═══════════════════════════════════════════
    //  CONFIRM / UNCONFIRM
    // ═══════════════════════════════════════════
    function toggleConfirm(key) {
      const current = allTransactions[key]?.status;
      const newStatus = current === 'confirmed' ? 'new' : 'confirmed';
      try {
        firebase.database().ref(`branch2_orders/${key}`).update({ status: newStatus });
      } catch (e) { console.error("Update failed", e); }
    }

    // ═══════════════════════════════════════════
    //  NEW PAYMENT OVERLAY
    // ═══════════════════════════════════════════
    function showNewPaymentOverlay(data) {
      const overlay = document.getElementById('newPaymentOverlay');
      document.getElementById('overlayAmount').innerText = '₮' + (data.amount || '0');
      document.getElementById('overlayRemark').innerText = data.remark || '-';
      overlay.style.display = 'flex';
      overlay.classList.remove('hidden');

      // Auto-dismiss after 6 seconds
      setTimeout(dismissOverlay, 6000);
    }

    function dismissOverlay() {
      const overlay = document.getElementById('newPaymentOverlay');
      overlay.style.display = 'none';
      overlay.classList.add('hidden');
    }

    // ═══════════════════════════════════════════
    //  MODAL HANDLERS
    // ═══════════════════════════════════════════
    function openConfigModal() {
      document.getElementById('cfgDbUrl').value = CONFIG.databaseURL;
      document.getElementById('cfgProjectId').value = CONFIG.projectId;
      const modal = document.getElementById('configModal');
      modal.style.display = 'flex';
      modal.classList.remove('hidden');
    }

    function closeConfigModal() {
      const modal = document.getElementById('configModal');
      modal.style.display = 'none';
      modal.classList.add('hidden');
    }

    function saveConfig() {
      const url = document.getElementById('cfgDbUrl').value.trim();
      const pid = document.getElementById('cfgProjectId').value.trim();
      if (url) {
        localStorage.setItem('fb_db_url', url);
        localStorage.setItem('fb_project_id', pid);
        location.reload();
      }
    }

    // ═══════════════════════════════════════════
    //  UTILITIES
    // ═══════════════════════════════════════════
    function escapeHtml(text) {
      const d = document.createElement('div');
      d.innerText = text;
      return d.innerHTML;
    }

    // Unlock audio on first user touch (iOS/Android requirement)
    document.addEventListener('click', function unlock() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      document.removeEventListener('click', unlock);
    }, { once: true });

    // ═══════════════════════════════════════════
    //  BROWSER PUSH NOTIFICATIONS
    // ═══════════════════════════════════════════
    let notifPermission = Notification?.permission || 'default';

    function checkNotifSupport() {
      return ('Notification' in window);
    }

    function updateNotifUI() {
      const btn = document.getElementById('notifBtn');
      const banner = document.getElementById('notifBanner');

      if (!checkNotifSupport()) {
        // Browser doesn't support notifications
        if (btn) btn.style.display = 'none';
        if (banner) banner.classList.add('hidden');
        return;
      }

      notifPermission = Notification.permission;

      if (notifPermission === 'granted') {
        // Notifications enabled
        if (btn) btn.innerText = '🔔';
        if (btn) btn.title = 'Мэдэгдэл: Идэвхтэй';
        if (banner) banner.classList.add('hidden');
      } else if (notifPermission === 'denied') {
        // User blocked notifications
        if (btn) btn.innerText = '🚫';
        if (btn) btn.title = 'Мэдэгдэл: Хориглосон (Хөтчийн тохиргоогоор нээнэ үү)';
        if (banner) banner.classList.add('hidden');
      } else {
        // Not yet asked — show banner
        if (btn) btn.innerText = '📳';
        if (btn) btn.title = 'Мэдэгдэл зөвшөөрөх';
        if (banner) banner.classList.remove('hidden');
      }
    }

    async function requestNotifPermission() {
      if (!checkNotifSupport()) {
        alert('Энэ хөтөч мэдэгдлийг дэмжихгүй байна.');
        return;
      }

      try {
        const result = await Notification.requestPermission();
        notifPermission = result;
        updateNotifUI();

        if (result === 'granted') {
          // Send a test notification
          new Notification('✅ Мэдэгдэл идэвхжлээ!', {
            body: 'Шинэ шилжүүлэг ирэхэд танд мэдэгдэл ирнэ.',
            icon: '💰',
            tag: 'test-notif',
            silent: false
          });
        } else if (result === 'denied') {
          alert('Мэдэгдэл хориглогдсон байна.\n\nХөтчийн тохиргоо (🔒 хаягийн мөр) дээр дарж "Мэдэгдэл"-ийг зөвшөөрнө үү.');
        }
      } catch (e) {
        console.error('Notification permission error:', e);
      }
    }

    function sendBrowserNotification(data) {
      // Only send when tab is NOT focused (background/minimized)
      if (document.hasFocus()) return;
      if (notifPermission !== 'granted') return;

      const amount = data.amount || '0';
      const remark = data.remark || '';

      try {
        const notif = new Notification('💰 Шинэ орлого — Салбар 2', {
          body: `₮${amount}\n${remark}`,
          icon: '💰',
          badge: '💰',
          tag: 'payment-' + Date.now(),
          requireInteraction: true,   // Stays visible until tapped
          vibrate: [200, 100, 200],   // Vibrate pattern for Android
          silent: false
        });

        // When cashier taps the notification, bring the app to focus
        notif.onclick = function () {
          window.focus();
          notif.close();
        };

        // Auto-close after 30 seconds
        setTimeout(() => notif.close(), 30000);
      } catch (e) {
        console.warn('Notification failed:', e);
      }
    }

    // ═══════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', () => {
      updateNotifUI();
      renderDatePills();
      initFirebase();
    });
  </script>
</body>
</html>
